# Edge Academy: nginx in front of the PM2 processes in deploy/ecosystem.config.cjs.
# deploy/setup.sh links it:  /etc/nginx/sites-enabled/edge-academy -> <repo>/deploy/nginx.conf
# After editing:  sudo nginx -t && sudo systemctl reload nginx
# Ubuntu 24.04 ships nginx 1.24, hence "listen 443 ssl http2" ("http2 on" needs 1.25.1+).

# Shared by the four HTTPS servers below (this VPS serves only Edge Academy). TLS protocol settings
# come from Ubuntu's /etc/nginx/nginx.conf; repeating them here would make `nginx -t` fail.
ssl_certificate     /etc/letsencrypt/live/edge-academy/fullchain.pem;   # certbot --cert-name edge-academy
ssl_certificate_key /etc/letsencrypt/live/edge-academy/privkey.pem;

proxy_http_version  1.1;
proxy_set_header    Host              $host;
proxy_set_header    X-Forwarded-Host  $host;
proxy_set_header    X-Forwarded-Proto $scheme;
# One address, not a list: Better Auth ignores a multi-entry X-Forwarded-For, which would put
# every user in the same rate-limit bucket.
proxy_set_header    X-Forwarded-For   $remote_addr;

server {
    listen 80;
    listen [::]:80;
    server_name portal.edgeacademy.ae console.edgeacademy.ae crm.edgeacademy.ae api.edgeacademy.ae;
    # In a location, not at server level, so certbot's renewal challenge still gets through.
    location / {
        return 301 https://$host$request_uri;
    }
}

# Student portal
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name portal.edgeacademy.ae;
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_buffering off;   # pages stream as they render
    }
}

# Staff console and admin panel
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name console.edgeacademy.ae;
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_buffering off;
    }
}

# Sales CRM
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name crm.edgeacademy.ae;
    client_max_body_size 10m;   # CSV imports

    # The phone app's APK and latest.json, uploaded by apps/mobile/scripts/publish-apk.sh. Not in the repo.
    location ^~ /android/ {
        alias /var/www/edge-crm/android/;
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_buffering off;
    }
}

# API: public only for health, webhooks, signed video links, /api/public (browser forms on the academy's
# other sites, CORS-allowlisted by PUBLIC_FORM_ORIGINS) and the CRM phone app's paths. Auth, the rest of /api/v1
# and everything else reach the API through the three Next apps on 127.0.0.1, never through this host.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.edgeacademy.ae;
    client_max_body_size 1m;

    location = /api/health {
        proxy_pass http://127.0.0.1:4000;
    }
    location ^~ /api/webhooks/ {
        proxy_pass http://127.0.0.1:4000;
    }
    location ^~ /api/public/ {
        proxy_pass http://127.0.0.1:4000;
    }
    location ^~ /api/media/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_buffering off;       # stream video (and range requests) straight through
        proxy_read_timeout 300s;
    }
    # CRM phone app. These only open the door: the API admits a device token to the routes in `deviceRoutes`
    # (packages/contracts/src/mobile.ts) and answers 404 to the rest, so keep this list no wider than the app needs.
    location ^~ /api/v1/mobile/ {
        proxy_pass http://127.0.0.1:4000;
    }
    location ^~ /api/v1/crm/ {
        proxy_pass http://127.0.0.1:4000;
    }
    location = /api/v1/me {
        proxy_pass http://127.0.0.1:4000;
    }
    location = /api/v1/notifications {
        proxy_pass http://127.0.0.1:4000;
    }
    location / {
        return 404;
    }
}
