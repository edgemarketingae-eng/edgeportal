packages:
  - apps/*
  - packages/*
  - tools/*
  - e2e

# One version of each shared dependency across the monorepo.
catalog:
  "@dnd-kit/core": 6.3.1
  "@dnd-kit/sortable": 10.0.0
  "@dnd-kit/utilities": 3.2.2
  "@types/node": ^24.19.1
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  better-auth: 1.7.7
  bullmq: 6.3.12
  decimal.js: ^10.6.0
  eslint: ^9.39.5
  fast-check: ^4.10.2
  ioredis: ^5.11.1
  mongodb: ~7.7.0
  mongodb-memory-server: 11.3.0
  mongoose: 9.11.1
  next: 16.4.2
  prettier: ^3.9.10
  prettier-plugin-tailwindcss: ^0.8.1
  react: ^19.2.8
  react-dom: ^19.2.8
  tsx: ^4.23.15
  turbo: 2.11.7
  typescript: ^5.9.3
  typescript-eslint: ^8.71.1
  tsdown: 0.23.1
  "@eslint/js": ^9.39.1
  # UI (shared by @edge/ui and both Next apps)
  "@hookform/resolvers": ^5.9.1
  "@tailwindcss/turbopack": ^4.3.3
  class-variance-authority: ^0.7.1
  cn: ^0.4.0
  input-otp: ^1.5.0
  lucide-react: ^1.52.0
  next-themes: ^0.4.6
  radix-ui: ^1.7.0
  react-day-picker: ^10.0.2
  react-hook-form: ^7.89.0
  shadcn: ^4.21.3
  sonner: ^2.0.8
  tailwindcss: ^4.3.3
  tw-animate-css: ^1.4.0
  eslint-config-next: 16.4.2
  vitest: ^5.0.3
  zod: ^4.6.6

# Exactly one copy of the MongoDB driver: Better Auth's adapter and Mongoose must share BSON classes.
overrides:
  mongodb: ~7.7.0

onlyBuiltDependencies:
  - esbuild
  - sharp
  - "@tailwindcss/oxide"
  - mongodb-memory-server
  - msgpackr-extract
ignoredBuiltDependencies:
  - unrs-resolver
